name: tunnel-e2e

networks:
  tunnel-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: cnexus
    networks: [tunnel-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cnexus"]
      interval: 1s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    networks: [tunnel-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 30

  schema-applier:
    image: postgres:16-alpine
    networks: [tunnel-net]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../crates/gw-store/migrations:/migrations:ro
      - ./seed:/seed:ro
    environment:
      PGPASSWORD: e2e
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: cnexus
    entrypoint: ["/seed/01_schema.sh"]
    restart: "no"

  fake-upstream:
    build:
      context: ../..
      dockerfile: Dockerfile.tunnel-e2e
    command: ["/usr/local/bin/fake_upstream"]
    networks:
      tunnel-net:
        aliases:
          # The gateway's SafeDnsResolver uses public DoH and blocks private
          # Docker IPs. This public hostname passes that check, while Docker DNS
          # routes in-network clients to the fake upstream container.
          - example.com
    expose: ["9000", "9001", "9443"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9001/healthz || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  fake-web:
    build:
      context: ../..
      dockerfile: Dockerfile.tunnel-e2e
    command: ["/usr/local/bin/fake_web"]
    depends_on:
      schema-applier:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      FAKE_WEB_PG_URL: postgres://postgres:e2e@postgres:5432/cnexus
      FAKE_WEB_REDIS_URL: redis://redis:6379
    networks: [tunnel-net]
    expose: ["7000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7000/healthz || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  cnexus-tunnel-server:
    build:
      context: ../..
      dockerfile: Dockerfile.tunnel-e2e
    command:
      - /usr/local/bin/gw-tunnel-server
      - --bind
      - 0.0.0.0:7000
      - --max-streams
      - "64"
      - --allow-target
      - example.com:9000
      - --allow-target
      - example.com:9443
    networks: [tunnel-net]
    expose: ["7000"]
    depends_on:
      fake-upstream:
        condition: service_healthy

  ali-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile.tunnel-e2e
    command: ["/usr/local/bin/gw-gateway"]
    depends_on:
      schema-applier:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      fake-web:
        condition: service_healthy
      fake-upstream:
        condition: service_healthy
      cnexus-tunnel-server:
        condition: service_started
    environment:
      GW_PGSQL__URL: postgres://postgres:e2e@postgres:5432/cnexus
      GW_REDIS__URL: redis://redis:6379
      GW_KMS__KEK_HEX: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      GW_TUNNEL__ENABLED: "true"
      GW_ADMIN__UPSTREAM_URL: http://fake-web:7000
      GW_SERVER__BUSINESS_PORT: "8000"
      GW_SERVER__METRICS_PORT: "9090"
      GW_SERVER__HEALTH_PORT: "8080"
      RUST_LOG: info,gw_tunnel_client=debug,gw_proxy=debug,gw_gateway=debug
    volumes:
      - ./config/local.toml:/app/config/local.toml:ro
    networks: [tunnel-net]
    expose: ["8000", "9090", "8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60

  pytest-runner:
    image: python:3.12-slim
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      ALI_GATEWAY_URL: http://ali-gateway:8000
      ALI_METRICS_URL: http://ali-gateway:9090
      FAKE_WEB_URL: http://fake-web:7000
      FAKE_UPSTREAM_ADMIN_URL: http://fake-upstream:9001
      PG_DSN: postgres://postgres:e2e@postgres:5432/cnexus
      REDIS_URL: redis://redis:6379
    command: >
      bash -c "pip install -q -r requirements.txt &&
               pytest -q --tb=short --junit-xml=logs/junit.xml scenarios/"
    networks: [tunnel-net]
    depends_on:
      ali-gateway:
        condition: service_healthy
      fake-web:
        condition: service_healthy
      fake-upstream:
        condition: service_healthy
