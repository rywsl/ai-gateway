[package]
name = "gw-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "gw-gateway"
path = "src/main.rs"

[lib]
name = "gw_gateway"
path = "src/lib.rs"

[features]
default = []
tunnel = ["dep:gw-tunnel-client", "gw-proxy/tunnel"]

[dependencies]
gw-core = { path = "../gw-core" }
gw-health = { path = "../gw-health" }
gw-proxy = { path = "../gw-proxy" }
gw-store = { path = "../gw-store" }
gw-auth = { path = "../gw-auth" }
gw-routing = { path = "../gw-routing" }
gw-capability = { path = "../gw-capability" }
gw-ledger = { path = "../gw-ledger" }
gw-codec = { path = "../gw-codec" }
gw-tunnel-client = { path = "../gw-tunnel-client", optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
figment.workspace = true
# `pingora` provides the Server runtime; `pingora-proxy` provides the
# `http_proxy_service` constructor + `ProxyHttp` trait that `gw-proxy`
# implements against. Both are needed at link time.
pingora.workspace = true
pingora-proxy.workspace = true
# rustls is reachable transitively via pingora-rustls. We need the crate
# path directly so we can call `crypto::ring::default_provider().install_default()`
# at startup — both `aws-lc-rs` (rustls 0.23 default) and `ring` (pingora-
# rustls direct dep) end up linked, and rustls refuses to auto-select. See
# `gw_gateway::run` for the install site.
rustls = "0.23"
tikv-jemallocator.workspace = true
secrecy.workspace = true
hex.workspace = true
url.workspace = true

[dev-dependencies]
# Phase 6 e2e + failure-mode integration tests. Most of these are pulled in
# only by `tests/` and are not linked into the binary.
testcontainers.workspace = true
testcontainers-modules.workspace = true
sqlx = { workspace = true }
bytes.workspace = true
