[package]
name = "gw-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "gw-gateway"
path = "src/main.rs"

[lib]
name = "gw_gateway"
path = "src/lib.rs"

[dependencies]
gw-core = { path = "../gw-core" }
gw-health = { path = "../gw-health" }
gw-proxy = { path = "../gw-proxy" }
gw-store = { path = "../gw-store" }
gw-auth = { path = "../gw-auth" }
gw-routing = { path = "../gw-routing" }
gw-ledger = { path = "../gw-ledger" }
gw-codec = { path = "../gw-codec" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
figment.workspace = true
# `pingora` provides the Server runtime; `pingora-proxy` provides the
# `http_proxy_service` constructor + `ProxyHttp` trait that `gw-proxy`
# implements against. Both are needed at link time.
pingora.workspace = true
pingora-proxy.workspace = true
tikv-jemallocator.workspace = true
secrecy.workspace = true
hex.workspace = true

[dev-dependencies]
# Phase 6 e2e + failure-mode integration tests. Most of these are pulled in
# only by `tests/` and are not linked into the binary.
testcontainers.workspace = true
testcontainers-modules.workspace = true
sqlx = { workspace = true }
reqwest.workspace = true
bytes.workspace = true
