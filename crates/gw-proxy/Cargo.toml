[package]
name = "gw-proxy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
tunnel = ["dep:gw-tunnel-client", "dep:tokio-rustls", "dep:webpki-roots"]

[dependencies]
gw-core = { path = "../gw-core" }
gw-codec = { path = "../gw-codec" }
gw-health = { path = "../gw-health" }
gw-store = { path = "../gw-store" }
gw-auth = { path = "../gw-auth" }
gw-routing = { path = "../gw-routing" }
gw-ledger = { path = "../gw-ledger" }
gw-capability = { path = "../gw-capability" }
gw-billing = { path = "../gw-billing" }
gw-task = { path = "../gw-task" }
gw-adapter = { path = "../gw-adapter" }
gw-tunnel-client = { path = "../gw-tunnel-client", optional = true }
tokio-rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
gw-egress-impersonate = { path = "../gw-egress-impersonate" }
gw-runtime = { path = "../gw-runtime" }
async-trait.workspace = true
anyhow.workspace = true
bytes.workspace = true
pingora.workspace = true
pingora-proxy.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
tracing.workspace = true
metrics.workspace = true
time.workspace = true
secrecy.workspace = true
tikv-jemalloc-ctl.workspace = true
rand.workspace = true
hex.workspace = true
url.workspace = true
thiserror.workspace = true
once_cell.workspace = true
dashmap.workspace = true
arc-swap.workspace = true
fred.workspace = true
sha2.workspace = true
reqwest.workspace = true
sqlx.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
gw-tunnel-server = { path = "../gw-tunnel-server" }
parking_lot = { workspace = true }
flate2 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
insta = { workspace = true }
tempfile = "3"
