[package]
name = "gw-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gw-core = { path = "../gw-core" }
gw-runtime = { path = "../gw-runtime" }
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
# `parsing` for OffsetDateTime::parse(Rfc3339) in loader::de::flexible_timestamp
# (audit 2026-05-30 §1.7); previously available only via cross-crate feature
# unification, which broke `cargo test -p gw-store` in isolation.
time = { workspace = true, features = ["parsing"] }
secrecy.workspace = true
url.workspace = true
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
moka.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
fred.workspace = true
sqlx.workspace = true
aes-gcm.workspace = true
arc-swap.workspace = true
rand.workspace = true
tracing.workspace = true
metrics.workspace = true
reqwest.workspace = true

[dev-dependencies]
testcontainers.workspace = true
testcontainers-modules.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true
