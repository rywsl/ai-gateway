[package]
name = "gw-egress-impersonate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "In-process BoringSSL/wreq impersonating egress for gw-proxy."

[dependencies]
gw-core = { path = "../gw-core" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
tracing = "0.1"
thiserror = { workspace = true }
anyhow = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
moka = { workspace = true }
metrics = "0.23"

wreq = { workspace = true }
wreq-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
futures-util = { workspace = true }

[features]
## Enables test-only constructors (e.g. `Handler::new_with_scheme`).
## Never enable in production builds.
test-utils = []

[dev-dependencies]
gw-egress-impersonate = { path = ".", features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
gw-core = { path = "../gw-core" }
url = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
hyper = { version = "1.4", features = ["server", "http1", "client"] }
http-body-util = { workspace = true }
bytes = { workspace = true }
