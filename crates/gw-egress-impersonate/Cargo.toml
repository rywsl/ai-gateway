[package]
name = "gw-egress-impersonate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "In-process BoringSSL/wreq impersonating egress for gw-proxy."

[dependencies]
gw-core = { path = "../gw-core" }
gw-runtime = { path = "../gw-runtime" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
tracing = "0.1"
thiserror = { workspace = true }
anyhow = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
moka = { workspace = true }
metrics = "0.23"

wreq = { workspace = true }
wreq-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
futures-util = { workspace = true }

[features]
## Enables test-only constructors (e.g. `Handler::new_with_scheme`).
## Never enable in production builds.
test-utils = []

## Opts the `fingerprint_verify` integration test into the build. Off by
## default — the test needs `GW_FINGERPRINT_ECHO_URL` to point at a JA3/JA4
## echo service (e.g. mitm-fingerprint) and is intended for nightly CI.
fingerprint-verify = []

[dev-dependencies]
gw-egress-impersonate = { path = ".", features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
gw-core = { path = "../gw-core" }
url = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
hyper = { workspace = true, features = ["client"] }
criterion = { workspace = true }
tls-parser = "0.12"

[[bench]]
name = "loopback_rtt"
harness = false
