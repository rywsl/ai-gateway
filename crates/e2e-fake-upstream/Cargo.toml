[package]
name = "e2e-fake-upstream"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

[lib]
name = "e2e_fake_upstream"
path = "src/lib.rs"

[[bin]]
name = "fake_upstream"
path = "src/main.rs"

[dependencies]
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
regex = "1"
futures-util = "0.3"
httparse = "1"
socket2 = "0.5"
base64 = "0.22"
