[package]
name = "e2e-fake-upstream"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

[lib]
name = "e2e_fake_upstream"
path = "src/lib.rs"

[[bin]]
name = "fake_upstream"
path = "src/main.rs"

[dependencies]
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
regex = "1"
futures-util = "0.3"
tokio-tungstenite = "0.24"
httparse = "1"
socket2 = "0.5"
base64 = "0.22"
# ADR-S5: TLS variant of the business listener on port 9443. Self-signed cert
# generated at startup; gateway truststore intentionally does not trust it,
# so pingora's TLS handshake fails inside `fail_to_connect` with
# ConnectErrorKind::Tls. Pinned to ring crypto provider to avoid pulling
# aws-lc-rs (heavy build) and to match the workspace's existing `ring`
# transitive dep via hickory-resolver.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rand = "0.8"
