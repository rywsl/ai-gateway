groups:
  - name: egress-impersonate
    rules:
      # Production observations include real upstream latency; the pure
      # loopback-overhead SLO remains gated by the microbench. This alert is a
      # coarse production guard for sustained egress path regressions.
      - alert: EgressLoopbackP99High
        expr: histogram_quantile(0.99, sum(rate(gw_egress_loopback_rtt_seconds_bucket[5m])) by (le)) > 0.0002
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "egress loopback p99 RTT > 200us (overhead SLO, gap #6)"
          description: "Remediation ladder: ClientPool tuning -> hyper keep-alive -> profile-bind sharding -> revert that vendor to direct egress."
