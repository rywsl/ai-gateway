stages:
  - build
  - push
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  K8S_NAMESPACE: cnewxus-prod
  GATEWAY_IMAGE: "$CI_REGISTRY_IMAGE"

rust-build:
  stage: build
  image: rust:1.88-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends cmake build-essential pkg-config perl libssl-dev libclang-dev
  script:
    - cargo build --release --locked -p gw-gateway

push-image:
  stage: push
  image: docker:29
  services:
    - name: docker:29-dind
      alias: docker
  needs:
    - rust-build
  rules:
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  script:
    - docker build --pull -f Dockerfile -t "$GATEWAY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$GATEWAY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$GATEWAY_IMAGE:$CI_COMMIT_SHORT_SHA" "$GATEWAY_IMAGE:latest"
        docker push "$GATEWAY_IMAGE:latest"
      fi

cleanup-registry:
  stage: push
  image: alpine:3.20
  needs:
    - push-image
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache curl jq
  script:
    - ./scripts/gitlab-cleanup-registry.sh

deploy-xg1:
  stage: deploy
  image:
    name: bitnami/kubectl:1.30
    entrypoint: [""]
  needs:
    - push-image
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - mkdir -p .kube
    - echo "$K3S_XG1_KUBECONFIG_B64" | base64 -d > .kube/config
    - export KUBECONFIG="$PWD/.kube/config"
  script:
    - kubectl -n "$K8S_NAMESPACE" set image deployment/rust-gateway rust-gateway="$GATEWAY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - kubectl -n "$K8S_NAMESPACE" rollout status deployment/rust-gateway --timeout=300s
    - kubectl -n "$K8S_NAMESPACE" run gateway-smoke-$CI_PIPELINE_ID --rm -i --restart=Never --image=curlimages/curl:8.10.1 --command -- curl -fsS http://rust-gateway:8080/readyz
