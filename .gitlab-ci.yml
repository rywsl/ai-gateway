stages:
  - build
  - push

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

variables:
  REGISTRY_HOST: "gitlab.ailinkmax.com:5050"
  GATEWAY_IMAGE: "gitlab.ailinkmax.com:5050/ailinkmax/cnxus-rust"

rust-build:
  stage: build
  image: rust:1.88-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends cmake build-essential pkg-config perl libssl-dev libclang-dev
  script:
    - cargo build --release --locked -p gw-gateway

push-image:
  stage: push
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  needs:
    - rust-build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$REGISTRY_HOST":{"username":"$CI_REGISTRY_USER","password":"$CI_REGISTRY_PASSWORD"}}}
      EOF
  script:
    - |
      destinations="--destination $GATEWAY_IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        destinations="$destinations --destination $GATEWAY_IMAGE:latest"
      fi
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        $destinations

cleanup-registry:
  stage: push
  image: alpine:3.20
  needs:
    - push-image
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache curl jq
  script:
    - ./scripts/gitlab-cleanup-registry.sh
