stages:
  - test
  - build
  - push

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

variables:
  REGISTRY_HOST: "gitlab.ailinkmax.com:5050"
  GATEWAY_IMAGE: "gitlab.ailinkmax.com:5050/ailinkmax/cnxus-rust"
  STORAGE_DRIVER: "vfs"
  BUILDAH_FORMAT: "docker"
  BUILDAH_ISOLATION: "chroot"
  APT_MIRROR: "http://mirrors.aliyun.com/debian"
  APT_SECURITY_MIRROR: "http://mirrors.aliyun.com/debian-security"
  APT_RETRIES: "5"
  APT_HTTP_TIMEOUT_SECONDS: "20"

.retry:
  before_script:
    - |
      retry() {
        attempts="${RETRY_ATTEMPTS:-4}"
        delay="${RETRY_DELAY_SECONDS:-15}"
        n=1
        until "$@"; do
          status="$?"
          if [ "$n" -ge "$attempts" ]; then
            echo "command failed after $n attempts: $*" >&2
            return "$status"
          fi
          echo "command failed with status $status; retrying in ${delay}s ($n/$attempts): $*" >&2
          sleep "$delay"
          n=$((n + 1))
          delay=$((delay * 2))
        done
      }

.setup-tools:
  before_script:
    - !reference [.retry, before_script]
    - |
      run_as_root() {
        if [ "$(id -u)" = "0" ]; then
          "$@"
        elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
          sudo -n "$@"
        else
          echo "required system dependency is missing and this shell runner cannot elevate to install it" >&2
          return 127
        fi
      }

      can_install_packages() {
        [ "$(id -u)" = "0" ] || { command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; }
      }

      configure_apt_sources() {
        mirror="${APT_MIRROR:-http://mirrors.aliyun.com/debian}"
        security_mirror="${APT_SECURITY_MIRROR:-http://mirrors.aliyun.com/debian-security}"

        for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources; do
          [ -f "$source_file" ] || continue
          run_as_root sed -i \
            -e "s|http://deb.debian.org/debian-security|${security_mirror}|g" \
            -e "s|https://deb.debian.org/debian-security|${security_mirror}|g" \
            -e "s|http://security.debian.org/debian-security|${security_mirror}|g" \
            -e "s|https://security.debian.org/debian-security|${security_mirror}|g" \
            -e "s|http://deb.debian.org/debian|${mirror}|g" \
            -e "s|https://deb.debian.org/debian|${mirror}|g" \
            "$source_file"
        done
      }

      apt_get_root() {
        run_as_root apt-get \
          -o Acquire::Retries="${APT_RETRIES:-5}" \
          -o Acquire::http::Timeout="${APT_HTTP_TIMEOUT_SECONDS:-20}" \
          -o Acquire::https::Timeout="${APT_HTTP_TIMEOUT_SECONDS:-20}" \
          "$@"
      }

      apt_get_install_root() {
        run_as_root env DEBIAN_FRONTEND=noninteractive apt-get \
          -o Acquire::Retries="${APT_RETRIES:-5}" \
          -o Acquire::http::Timeout="${APT_HTTP_TIMEOUT_SECONDS:-20}" \
          -o Acquire::https::Timeout="${APT_HTTP_TIMEOUT_SECONDS:-20}" \
          "$@"
      }

      install_deb_packages() {
        configure_apt_sources
        retry apt_get_root update
        retry apt_get_install_root install -y --no-install-recommends "$@"
      }

.setup-rust-deps:
  before_script:
    - !reference [.setup-tools, before_script]
    - |
      rust_deps_packages="cmake build-essential pkg-config perl libssl-dev libclang-dev jq"

      rust_container_script() {
        cat <<'RUST_CONTAINER_SCRIPT'
      set -eu

      export PATH="/usr/local/cargo/bin:$HOME/.cargo/bin:$PATH"

      configure_apt_sources() {
        mirror="${APT_MIRROR:-http://mirrors.aliyun.com/debian}"
        security_mirror="${APT_SECURITY_MIRROR:-http://mirrors.aliyun.com/debian-security}"

        for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources; do
          [ -f "$source_file" ] || continue
          sed -i \
            -e "s|http://deb.debian.org/debian-security|${security_mirror}|g" \
            -e "s|https://deb.debian.org/debian-security|${security_mirror}|g" \
            -e "s|http://security.debian.org/debian-security|${security_mirror}|g" \
            -e "s|https://security.debian.org/debian-security|${security_mirror}|g" \
            -e "s|http://deb.debian.org/debian|${mirror}|g" \
            -e "s|https://deb.debian.org/debian|${mirror}|g" \
            "$source_file"
        done
      }

      apt_get() {
        apt-get \
          -o Acquire::Retries="${APT_RETRIES:-5}" \
          -o Acquire::http::Timeout="${APT_HTTP_TIMEOUT_SECONDS:-20}" \
          -o Acquire::https::Timeout="${APT_HTTP_TIMEOUT_SECONDS:-20}" \
          "$@"
      }

      configure_apt_sources
      export DEBIAN_FRONTEND=noninteractive
      apt_get update
      apt_get install -y --no-install-recommends "$@"
      rustup component add rustfmt clippy
      bash -lc "$CI_RUST_COMMAND"
      RUST_CONTAINER_SCRIPT
      }

      ensure_native_rust_deps() {
        missing=""
        for tool in cmake cc c++ pkg-config perl jq; do
          command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
        done
        if ! ldconfig -p 2>/dev/null | grep -q 'libclang\.so'; then
          missing="$missing libclang"
        fi

        if [ -n "$missing" ]; then
          if command -v apt-get >/dev/null 2>&1 && can_install_packages; then
            install_deb_packages cmake build-essential pkg-config perl libssl-dev libclang-dev jq
          else
            echo "rust build dependencies not preinstalled and cannot be installed by this runner:$missing" >&2
            echo "continuing so cargo reports the exact missing dependency if it is required" >&2
          fi
        fi

        if command -v rustup >/dev/null 2>&1; then
          rustup component add rustfmt clippy
        fi
      }

      ci_rust_command() {
        command="$1"
        export PATH="/usr/local/cargo/bin:$HOME/.cargo/bin:$PATH"

        if command -v cargo >/dev/null 2>&1; then
          ensure_native_rust_deps
          bash -c "$command"
          return
        fi

        if command -v docker >/dev/null 2>&1; then
          retry docker run --rm \
            -v "$CI_PROJECT_DIR:/work" \
            -w /work \
            -e CARGO_TERM_COLOR=always \
            -e APT_MIRROR="${APT_MIRROR:-}" \
            -e APT_SECURITY_MIRROR="${APT_SECURITY_MIRROR:-}" \
            -e APT_RETRIES="${APT_RETRIES:-}" \
            -e APT_HTTP_TIMEOUT_SECONDS="${APT_HTTP_TIMEOUT_SECONDS:-}" \
            -e CI_RUST_COMMAND="$command" \
            rust:1.88-bookworm \
            bash -lc "$(rust_container_script)" -- $rust_deps_packages
          return
        fi

        if command -v podman >/dev/null 2>&1; then
          retry podman run --rm \
            -v "$CI_PROJECT_DIR:/work" \
            -w /work \
            -e CARGO_TERM_COLOR=always \
            -e APT_MIRROR="${APT_MIRROR:-}" \
            -e APT_SECURITY_MIRROR="${APT_SECURITY_MIRROR:-}" \
            -e APT_RETRIES="${APT_RETRIES:-}" \
            -e APT_HTTP_TIMEOUT_SECONDS="${APT_HTTP_TIMEOUT_SECONDS:-}" \
            -e CI_RUST_COMMAND="$command" \
            rust:1.88-bookworm \
            bash -lc "$(rust_container_script)" -- $rust_deps_packages
          return
        fi

        echo "No cargo toolchain found, and neither docker nor podman is available on this shell runner" >&2
        return 127
      }

.setup-buildah:
  before_script:
    - !reference [.setup-tools, before_script]
    - |
      ensure_buildah() {
        if command -v buildah >/dev/null 2>&1; then
          buildah --version
          return
        fi

        if command -v apt-get >/dev/null 2>&1 && can_install_packages; then
          install_deb_packages buildah ca-certificates uidmap slirp4netns fuse-overlayfs
        else
          echo "buildah is not installed and this runner cannot install packages non-interactively" >&2
          return 127
        fi

        buildah --version
      }

      ensure_buildah
    - retry sh -c 'printf "%s" "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"'

lint-test:
  stage: test
  image: rust:1.88-bookworm
  extends: .setup-rust-deps
  script:
    - ci_rust_command 'cargo fmt --all -- --check && cargo clippy --workspace --all-targets --locked -- -D warnings'
rust-build:
  stage: build
  image: rust:1.88-bookworm
  needs:
    - lint-test
  extends: .setup-rust-deps
  script:
    - ci_rust_command 'cargo build --release --locked -p gw-gateway'

push-image:
  stage: push
  image: quay.io/buildah/stable:latest
  extends: .setup-buildah
  needs:
    - rust-build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - buildah build --file "$CI_PROJECT_DIR/Dockerfile" --tag "$GATEWAY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_PROJECT_DIR"
    - buildah push "$GATEWAY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        buildah tag "$GATEWAY_IMAGE:$CI_COMMIT_SHORT_SHA" "$GATEWAY_IMAGE:latest"
        buildah push "$GATEWAY_IMAGE:latest"
      fi
