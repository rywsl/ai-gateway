[toolchain]
# Pingora 0.8 transitively depends on `getrandom 0.4` (via `cf-rustracing`),
# which requires `wasip3` whose manifest uses `edition2024` (rustc >= 1.85).
# Bumped to 1.88 to unlock stable let-chains (`&& let` patterns) used by
# wreq-util's typed-builder-macro dep.
channel = "1.88.0"
components = ["rustfmt", "clippy"]
