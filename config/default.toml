# Default configuration for gw-gateway.
#
# This file ships in-tree; overrides come from (in precedence order, low → high):
#   1. config/default.toml (this file)
#   2. config/local.toml (gitignored, optional per-machine overrides)
#   3. environment variables prefixed with GW_, using __ as nesting separator.
#      e.g. `GW_REDIS__URL=redis://prod:6379` overrides `[redis] url = ...`.
#
# Secrets (KEK material, DB passwords) MUST be supplied via env vars, never
# committed.

[server]
business_port = 8000
metrics_port = 9090
health_port = 8080

[admin]
upstream_url = "http://localhost:3000"

[control_plane]
enabled = true
runtime_push_interval_ms = 2000
snapshot_ttl_ms = 10000
command_group = "group"
command_consumer_name = ""
command_block_ms = 5000

[redis]
url = "redis://localhost:6379"
pool_size = 8

[pgsql]
url = "postgres://postgres:postgres@localhost:5432/gateway"
max_connections = 16

[ratelimit]
# Workspace-global ceiling for requests per minute. Per-user RPM lives in
# DB and is enforced by gw-auth at request time.
global_rpm = 100000

[ip_filter]
allowlist_mode = "Off"

[ip_ratelimit]
global_per_ip_rpm = 600
max_entries = 100000
sweep_interval_secs = 300

[adaptive_rpm]
enforcement_threshold = 0.6
confidence_decay_per_min = 0.02
min_header_observations = 2
min_no_header_observations = 3
buffer_ratio = 0.85
probe_after_min = 30
probe_increment = 5
min_rpm = 5
max_rpm = 10000

[task]
enabled = false
queue_stream = "tasks:queue"
cancel_stream = "tasks:cancel"
billing_base_micro = 1000
billing_vendor_multiplier = 1.0
billing_estimated_duration_secs = 60

[ledger]
# Bounded mpsc channel between proxy filters and the background flusher.
# `try_send` drops records (with a counter increment) when full to keep the
# request path latency-bounded.
channel_capacity = 65536
batch_size = 200
flush_interval_ms = 200

[kms]
# Dev mode: provide a 32-byte KEK as 64 hex chars via env var
# `GW_KMS__KEK_HEX=...`. Production mode (AWS KMS) is wired separately.
# Rotation window: also set `GW_KMS__PREVIOUS_KEK_HEX=...` and
# `GW_KMS__PREVIOUS_KEY_ID=...` so restarted pods can read old and new rows.
key_id = "primary"

[detailed_log]
# Wire-fidelity request/response archive. Spec:
# docs/spec/06-billing-ledger.md
enabled = true
stream = "usage:detailed"
maxlen = 10_000_000

[detailed_log.compression]
small_threshold_bytes  = 1024
medium_threshold_bytes = 65536
zstd_level = 3

[detailed_log.channel]
capacity = 65536

[detailed_log.flusher]
workers = 0   # 0 = num_cpus.saturating_div(4).max(1)

[detailed_log.limits]
single_payload_soft_cap_bytes = 8_388_608

[security]
# When true, parse the client IP from the X-Forwarded-For header (first /
# left-most entry). MUST only be enabled behind a trusted L7 load balancer
# that strips client-supplied XFF headers; otherwise the IP blocklist is
# trivially bypassable. Defaults to false so misconfigured deployments fail
# closed (i.e. blocklist matches the LB's IP, not arbitrary clients).
trust_xff = false

[signature]
required = false

[routing]
# How long the `Sticky` strategy keeps a conversation_id → vendor_key_id
# binding in its moka cache. Production default is 30 min — long enough to
# outlive most chat sessions, short enough that abandoned conversations
# don't pin keys forever. Override via `GW_ROUTING__STICKY_TTL_SECS=<n>`.
# See docs/architecture.md.
sticky_ttl_secs = 1800

[routing.reservation]
enabled = false
interval_secs = 5
thresholds = {}

[routing.presets]
health_first = { health = 0.6, latency = 0.2, cost = 0.1, inflight = 0.1, error_rate = 0.0, reservation = 0.0 }
latency_first = { health = 0.2, latency = 0.5, cost = 0.1, inflight = 0.2, error_rate = 0.0, reservation = 0.0 }
cost_first = { health = 0.2, latency = 0.1, cost = 0.5, inflight = 0.1, error_rate = 0.1, reservation = 0.0 }
balanced = { health = 0.25, latency = 0.25, cost = 0.25, inflight = 0.15, error_rate = 0.1, reservation = 0.0 }

[auth]
hard_cap_max_input_tokens = 1_000_000
hard_cap_max_cost_micro = 5_000_000_000

[tunnel]
# Tunnel subsystem (ADR-T-5). Default off — pick_peer uses the Direct path.
# Flipping to true requires restart (SIGHUP), not a hot-reload. Override
# via GW_TUNNEL__ENABLED=true.
enabled = false
doh = "cloudflare"
dns_cache_ttl_secs = 600
target_whitelist = []
dns_overrides = {}
heartbeat_interval_secs = 30
missed_pong_threshold = 3
backoff_min_secs = 1
backoff_max_secs = 60
max_streams_per_conn = 256

[billing]
cancel_grace_ms = 200             # 上游 cancel 后等待 final usage frame 的窗口 (ms)
response_deadline_ms = 300_000    # 上游响应总超时, 默认 5min
reaper_interval_secs = 30         # InflightLedger T0 watchdog 周期
emit_lag_t0_secs = 60             # ts_settled_ms 后未清 key 视为 T0 bug 的阈值
heartbeat_interval_secs = 60      # instance heartbeat 续期周期
heartbeat_ttl_secs = 600          # heartbeat key TTL (供 Go-side reaper 探活)

# Per-endpoint body-rule defaults. Flat key-value pairs injected with
# set-if-absent semantics (existing client fields are never overridden).
# Example:
#   [body_rules."/v1/chat/completions"]
#   temperature = 0.7
#   top_p = 0.9
[body_rules]

[health.quota_probe]
enabled = false
interval_secs = 30
probe_endpoint = "/v1/models"

[quota_state_probe]
enabled = false
interval_secs = 300
probe_endpoint = "/v1/models"
max_pending = 1000

[error.classification]
# Upstream statuses eligible for response-side cross-key failover before body
# bytes are sent to the client. Boot-time only.
retryable_status_codes = [401, 402, 403, 429, 500, 502, 503, 504]
# Total wall-clock budget from request admission to the next failover decision.
failover_total_budget_ms = 30000

[egress]
# Workspace kill-switch for the egress-impersonate path. When true, vendors
# with egress_mode = Impersonate { .. } are excluded from candidate selection
# and the request fails with the normal no-candidates path; the metric
# gw_egress_disabled_total ticks per skipped vendor. Direct/Rustls vendors
# are not affected. Boot-time only.
disabled = false

# Where the in-process loopback egress listens. Either:
#   bind_uds = "/tmp/gw-egress.sock"    (unix-domain socket; default)
# or:
#   bind_tcp = "127.0.0.1:18080"        (loopback TCP, useful on platforms
#                                        without UDS or for local debug)
# Exactly one of bind_uds / bind_tcp must be set.
bind_uds = "/tmp/gw-egress.sock"

# Maximum concurrent loopback sessions handled by the supervisor before
# new connections back-pressure.
max_sessions = 64

# TTL on the in-process `TurnStateCache` (Codex per-turn state). The 300 s
# default is fail-static and based on the educated guess in spec §11 #2; tune it
# by packet-capturing a live Codex CLI session (known gap #2).
turn_state_ttl_secs = 300

[protection]
# Hard overdraft protection — credit lease layer above the legacy soft defense.
# See docs/spec/06-billing-ledger.md.
# Kill switch. When false, Rust ignores `events:counter ns=protected_lease`
# events and all requests use the legacy `frozen_micro` soft-defense path.
# Go-side lease TTL, low-balance threshold, and overcommit ratio are NOT in
# this table — they live in Go config, by design (spec §9).
enabled = false
# Clock-skew tolerance window (ms) when checking lease expiry.
lease_grace_ms = 5000
# Fallback `max_tokens` ceiling for credit estimation when the request has no
# explicit `max_tokens` and the model's entity config also lacks a default.
default_output_ceiling_tokens = 8192

# ---------------------------------------------------------------------------
# Shared runtime primitives (resilience-fixes T2.1)
# ---------------------------------------------------------------------------

[runtime.supervisor]
default_max_restarts = 5
default_window_ms = 60000
default_backoff_initial_ms = 100
default_backoff_max_ms = 30000
default_backoff_multiplier = 2.0
default_backoff_jitter = 0.2

[runtime.shutdown]
phase1_accept_stop_ms = 5000
phase2_task_drain_ms = 25000
hard_deadline_ms = 35000
billing_drain_ms = 20000

[runtime.spill_io]
root_dir = "/data/cnexus/spill"
max_total_bytes = 10737418240
buffer_size = 65536
dlq_shards = 4

[runtime.regex_cache]
capacity = 4096
tti_secs = 3600

[runtime.health]
evaluate_interval_ms = 1000
hysteresis_healthy_ticks = 3

[proxy.archive]
soft_cap_bytes = 4194304
hard_cap_bytes = 8388608
spill_dir = "/data/cnexus/spill/archive"
