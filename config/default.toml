# Default configuration for gw-gateway.
#
# This file ships in-tree; overrides come from (in precedence order, low → high):
#   1. config/default.toml (this file)
#   2. config/local.toml (gitignored, optional per-machine overrides)
#   3. environment variables prefixed with GW_, using __ as nesting separator.
#      e.g. `GW_REDIS__URL=redis://prod:6379` overrides `[redis] url = ...`.
#
# Secrets (KEK material, DB passwords) MUST be supplied via env vars, never
# committed.

[server]
business_port = 8000
metrics_port = 9090
health_port = 8080

[admin]
upstream_url = "http://localhost:3000"

[redis]
url = "redis://localhost:6379"
pool_size = 8

[pgsql]
url = "postgres://postgres:postgres@localhost:5432/gateway"
max_connections = 16

[ratelimit]
# Workspace-global ceiling for requests per minute. Per-user RPM lives in
# DB and is enforced by gw-auth at request time.
global_rpm = 100000

[ip_filter]
allowlist_mode = "Off"

[ip_ratelimit]
global_per_ip_rpm = 600
max_entries = 100000
sweep_interval_secs = 300

[adaptive_rpm]
enforcement_threshold = 0.6
confidence_decay_per_min = 0.02
min_header_observations = 2
min_no_header_observations = 3
buffer_ratio = 0.85
probe_after_min = 30
probe_increment = 5
min_rpm = 5
max_rpm = 10000

[task]
enabled = false
queue_stream = "tasks:queue"
cancel_stream = "tasks:cancel"
billing_base_micro = 1000
billing_vendor_multiplier = 1.0
billing_estimated_duration_secs = 60

[ledger]
# Bounded mpsc channel between proxy filters and the background flusher.
# `try_send` drops records (with a counter increment) when full to keep the
# request path latency-bounded.
channel_capacity = 65536
batch_size = 200
flush_interval_ms = 200

[kms]
# Dev mode: provide a 32-byte KEK as 64 hex chars via env var
# `GW_KMS__KEK_HEX=...`. Production mode (AWS KMS) is wired separately.
key_id = "primary"

[detailed_log]
# Wire-fidelity request/response archive. Spec:
# docs/superpowers/specs/2026-05-23-detailed-log-complete-design.md
enabled = true
stream = "usage:detailed"
maxlen = 10_000_000

[detailed_log.compression]
small_threshold_bytes  = 1024
medium_threshold_bytes = 65536
zstd_level = 3

[detailed_log.channel]
capacity = 65536

[detailed_log.flusher]
workers = 0   # 0 = num_cpus.saturating_div(4).max(1)

[detailed_log.limits]
single_payload_soft_cap_bytes = 8_388_608

[security]
# When true, parse the client IP from the X-Forwarded-For header (first /
# left-most entry). MUST only be enabled behind a trusted L7 load balancer
# that strips client-supplied XFF headers; otherwise the IP blocklist is
# trivially bypassable. Defaults to false so misconfigured deployments fail
# closed (i.e. blocklist matches the LB's IP, not arbitrary clients).
trust_xff = false

[signature]
required = false

[routing]
# How long the `Sticky` strategy keeps a conversation_id → vendor_key_id
# binding in its moka cache. Production default is 30 min — long enough to
# outlive most chat sessions, short enough that abandoned conversations
# don't pin keys forever. Override via `GW_ROUTING__STICKY_TTL_SECS=<n>`.
# ADR-S4 (docs/superpowers/specs/2026-05-22-e2e-skip-closure-design.md).
sticky_ttl_secs = 1800

[auth]
hard_cap_max_input_tokens = 1_000_000
hard_cap_max_cost_micro = 5_000_000_000

[tunnel]
# Tunnel subsystem (ADR-T-5). Default off — pick_peer uses the Direct path.
# Flipping to true requires restart (SIGHUP), not a hot-reload. Override
# via GW_TUNNEL__ENABLED=true.
enabled = false
doh = "cloudflare"
dns_cache_ttl_secs = 600
target_whitelist = []
heartbeat_interval_secs = 30
missed_pong_threshold = 3
backoff_min_secs = 1
backoff_max_secs = 60
max_streams_per_conn = 256

[billing]
cancel_grace_ms = 200             # 上游 cancel 后等待 final usage frame 的窗口 (ms)
response_deadline_ms = 300_000    # 上游响应总超时, 默认 5min
reaper_interval_secs = 30         # InflightLedger T0 watchdog 周期
emit_lag_t0_secs = 60             # ts_settled_ms 后未清 key 视为 T0 bug 的阈值
heartbeat_interval_secs = 60      # instance heartbeat 续期周期
heartbeat_ttl_secs = 600          # heartbeat key TTL (供 Go-side reaper 探活)
