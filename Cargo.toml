[workspace]
resolver = "2"
members = [
    "crates/gw-core",
    "crates/gw-codec-macros",
    "crates/gw-codec",
    "crates/gw-store",
    "crates/gw-auth",
    "crates/gw-adapter",
    "crates/gw-routing",
    "crates/gw-ledger",
    "crates/gw-billing",
    "crates/gw-task",
    "crates/gw-task-runtime",
    "crates/gw-task-worker",
    "crates/gw-health",
    "crates/gw-capability",
    "crates/gw-proxy",
    "crates/gw-gateway",
    "crates/gw-unified",
    "crates/gw-tunnel-client",
    "crates/gw-tunnel-server",
    "crates/e2e-fake-upstream",
    "crates/e2e-fake-web",
    "crates/gw-egress-impersonate",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
# 基础类型
bytes = "1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.3"
thiserror = "1"
anyhow = "1"
secrecy = { version = "0.10", features = ["serde"] }
time = { version = "0.3", features = ["serde", "macros"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
smallvec = { version = "1.13", features = ["serde"] }

# 异步
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# proc-macro
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
quote = "1"

# 缓存 / 并发
moka = { version = "0.12", features = ["future", "sync"] }
dashmap = "6"
parking_lot = "0.12"
arc-swap = "1"
once_cell = "1.20"

# 加密
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
rand = "0.8"

# 网关 / 网络
# `rustls` feature: pingora-core 默认 `default = []`，不启用任何 TLS backend
# 时 `HttpPeer.tls = true` 会落入 `noop_tls` 桩（poll_read→0、poll_write→丢
# 弃），所有 https 上游会卡死在「读 response headers」。rustls 与本工作区
# 其余 TLS 栈（reqwest / sqlx / tokio-tungstenite / e2e-fake-upstream）同源。
pingora = { version = "0.8", features = ["rustls"] }
pingora-proxy = { version = "0.8", features = ["rustls"] }
fred = { version = "9", features = ["metrics", "i-scripts", "i-sorted-sets"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "json"] }
jsonwebtoken = "9"
governor = "0.7"
ipnet = "2.10"
hex = "0.4"
crc32fast = "1.5"
brotli = "7"
flate2 = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode", "std"] }
zstd = { version = "0.13", default-features = false }
base64 = "0.22"
regex = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
webpki-roots = "1"
futures-util = "0.3"
hickory-resolver = { version = "0.25", features = ["https-ring", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
wreq = { version = "=6.0.0-rc.28", default-features = false, features = ["json", "stream"] }
wreq-util = { version = "=3.0.0-rc.11" }
hyper = { version = "1.4", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

# 可观测
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# 配置
figment = { version = "0.10", features = ["toml", "env", "test"] }

# 内存
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = "0.6"

hostname = "0.4"

# 测试
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "redis"] }
wiremock = "0.6"
criterion = { version = "0.5", features = ["async_tokio"] }
insta = { version = "1", features = ["yaml"] }
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
debug = true
