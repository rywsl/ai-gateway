name: header-drift

# Weekly drift detection: compares the static request headers the real
# Claude Code / Codex / Gemini CLIs send against the baselines committed
# under scripts/capture_real_client_headers/<profile>/expected.json.
#
# Intentionally NOT triggered on push / pull_request: it depends on
# authenticated CLI sessions and is gated behind a weekly cron plus manual
# dispatch.
on:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mitmproxy
        run: pip install mitmproxy

      - name: Install Claude Code / Codex / Gemini CLIs
        run: |
          # TODO: operator-fill. The CLIs authenticate via interactive OAuth,
          # so end-to-end capture cannot run in unattended CI without
          # pre-provisioned authenticated sessions (and the relevant secrets).
          # Gate any real capture behind a manual workflow_dispatch run in an
          # authenticated environment. See:
          #   scripts/capture_real_client_headers/README.md
          # Examples (operator-provided):
          #   npm install -g @anthropic-ai/claude-code
          #   npm install -g @openai/codex
          #   npm install -g @google/gemini-cli
          echo "CLI install requires an authenticated environment; see scripts/capture_real_client_headers/README.md"

      - name: Run capture diffs
        run: |
          ./scripts/capture_real_client_headers/claude-code/capture.sh
          ./scripts/capture_real_client_headers/codex/capture.sh
          ./scripts/capture_real_client_headers/gemini-cli/capture.sh
