name: ignored-tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  docker-backed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Run egress impersonate ignored regressions
        run: |
          cargo test -p gw-store --test identity_regenerate -- --ignored
          cargo test -p gw-gateway --test e2e_impersonate -- --ignored identity_snapshot_round_trips
