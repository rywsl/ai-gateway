name: cli-version-drift

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-cli-version-pools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update CLI version pools
        run: python3 scripts/cli_version_drift/check.py --write || true

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/cli-version-drift
          delete-branch: true
          title: "chore(impersonate): refresh CLI version pools"
          commit-message: "chore(impersonate): refresh CLI version pools (auto)"
          body: |
            Automated CLI version-pool refresh. Review the new versions against
            the real CLI releases before merging.

            Source: scripts/cli_version_drift/check.py

            - @anthropic-ai/claude-code
            - @google/gemini-cli
            - @openai/codex
          labels: impersonate, automated
