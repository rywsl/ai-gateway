services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - ./crates/gw-store/migrations/0001_initial.sql:/docker-entrypoint-initdb.d/0001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gateway"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GW_KMS__KEK_HEX: "aabbccddeeff00112233445566778899aabbccddeeff00112233445566778899"
      GW_REDIS__URL: "redis://redis:6379"
      GW_PGSQL__URL: "postgres://postgres:postgres@postgres:5432/gateway"
      GW_SERVER__BUSINESS_PORT: "8000"
      GW_SERVER__METRICS_PORT: "9090"
      GW_SERVER__HEALTH_PORT: "8080"
      RUST_LOG: "info,gw=debug"
    ports:
      - "8000:8000"
      - "9090:9090"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/livez || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20
